<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suniiyo Music - Live YouTube Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 220px; }
    
    header { background-color: #000000; padding: 20px; text-align: center; border-bottom: 1px solid #282828; }
    header h1 { color: #1db954; font-size: 28px; }
    header p { color: #b3b3b3; font-size: 14px; margin-top: 5px; margin-bottom: 15px; }

    .search-container { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto; }
    .search-box {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #1db954;
      background: #181818;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-btn {
      background: #1db954;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }
    .search-btn:hover { background: #1ed760; }

    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .section-title { font-size: 20px; margin: 20px 0; color: #1db954; border-left: 4px solid #1db954; padding-left: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }

    .card { background: #181818; padding: 12px; border-radius: 8px; border: 1px solid #282828; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { background: #282828; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .card h3 { font-size: 14px; margin-bottom: 5px; height: 36px; overflow: hidden; }
    .card p { color: #b3b3b3; font-size: 12px; margin-bottom: 10px; }
    .play-btn { background-color: #1db954; color: white; border: none; padding: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }

    .player-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: #181818; 
      border-top: 2px solid #1db954; 
      padding: 10px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 1000; 
      gap: 15px;
    }

    .mini-info { display: flex; align-items: center; gap: 12px; min-width: 180px; }
    .mini-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .song-info h4 { color: #1db954; font-size: 13px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-info p { color: #aaaaaa; font-size: 11px; }

    .player-middle { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1; max-width: 500px; }
    .player-controls { display: flex; align-items: center; gap: 8px; }
    .control-btn { background: #282828; color: #fff; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .control-btn.play-toggle { background: #1db954; color: #000; font-size: 14px; padding: 6px 16px; }

    .seek-container { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; color: #aaa; }
    .seek-bar { flex-grow: 1; accent-color: #1db954; cursor: pointer; }

    .player-screen { width: 1px; height: 1px; opacity: 0; position: absolute; }
  </style>
</head>
<body>

  <header>
    <h1>Suniiyo Music</h1>
    <p>Search & Stream Any Song from YouTube Live</p>
    <div class="search-container">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 Search any song or singer (e.g. Sidhu Moosewala, Diler Kharkiya)..." onkeydown="if(event.key==='Enter') searchYouTube()">
      <button class="search-btn" onclick="searchYouTube()">Search</button>
    </div>
  </header>

  <div class="container">
    <div class="section-title" id="results-title">🔥 Trending Hits</div>
    <div class="grid" id="songs-grid">
      <!-- Search Results Dynamic Here -->
    </div>
  </div>

  <div class="player-bar">
    <div class="mini-info">
      <img id="mini-img" class="mini-thumb" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100" alt="Cover">
      <div class="song-info">
        <h4 id="song-title">Select a Song</h4>
        <p id="artist-name">Suniiyo Player</p>
      </div>
    </div>

    <div class="player-middle">
      <div class="player-controls">
        <button class="control-btn" onclick="skipTime(-10)">⏪ 10s</button>
        <button class="control-btn play-toggle" id="main-play-btn" onclick="togglePlayPause()">▶</button>
        <button class="control-btn" onclick="skipTime(10)">10s ⏩</button>
      </div>

      <div class="seek-container">
        <span id="curr-time">0:00</span>
        <input type="range" id="seek-bar" class="seek-bar" value="0" max="100" onchange="seekToTime(this.value)">
        <span id="dur-time">0:00</span>
      </div>
    </div>

    <div class="player-screen">
      <div id="player"></div>
    </div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyDF3IzzrvxyCWmnrRiajzttXSOk4FqCbxE';
    let currentPlaylist = [];
    let currentIndex = 0;
    let ytPlayer;
    let isPlaying = false;
    let ytReady = false;

    // Load Initial Hits on Page Load
    window.onload = function() {
      fetchSongs('Haryanvi Punjabi Hindi Rajasthani songs');
    };

    async function fetchSongs(query) {
      document.getElementById('results-title').innerText = `Results for: "${query}"`;
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.items) {
          currentPlaylist = data.items.map(item => ({
            id: item.id.videoId,
            title: item.snippet.title,
            artist: item.snippet.channelTitle,
            img: item.snippet.thumbnails.high.url
          }));
          renderSongs(currentPlaylist);
        }
      } catch (err) {
        console.error("YouTube API Error:", err);
      }
    }

    function searchYouTube() {
      const q = document.getElementById('search-input').value;
      if (q.trim() !== '') {
        fetchSongs(q);
      }
    }

    function renderSongs(songs) {
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';
      songs.forEach((song, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${song.img}" alt="Thumb">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
          <button class="play-btn" onclick="playSong(${idx})">▶ Play Song</button>
        `;
        grid.appendChild(card);
      });
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: { 'autoplay': 1, 'controls': 0 },
        events: {
          'onReady': () => { ytReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function playSong(idx) {
      currentIndex = idx;
      const song = currentPlaylist[idx];
      document.getElementById('song-title').innerText = song.title;
      document.getElementById('artist-name').innerText = song.artist;
      document.getElementById('mini-img').src = song.img;

      if (ytPlayer && ytReady) {
        ytPlayer.loadVideoById(song.id);
        isPlaying = true;
        updatePlayBtnUI();
      }
    }

    function togglePlayPause() {
      if (!ytPlayer || !ytReady) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        isPlaying = false;
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
      }
      updatePlayBtnUI();
    }

    function updatePlayBtnUI() {
      document.getElementById('main-play-btn').innerText = isPlaying ? "⏸" : "▶";
    }

    function skipTime(sec) {
      if (ytPlayer && ytReady) {
        ytPlayer.seekTo(ytPlayer.getCurrentTime() + sec, true);
      }
    }

    function seekToTime(percent) {
      if (ytPlayer && ytReady && ytPlayer.getDuration) {
        ytPlayer.seekTo((percent / 100) * ytPlayer.getDuration(), true);
      }
    }

    setInterval(() => {
      if (ytPlayer && ytReady && isPlaying && ytPlayer.getCurrentTime) {
        const curr = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          document.getElementById('seek-bar').value = (curr / dur) * 100;
          document.getElementById('curr-time').innerText = formatTime(curr);
          document.getElementById('dur-time').innerText = formatTime(dur);
        }
      }
    }, 1000);

    function formatTime(t) {
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) { isPlaying = true; updatePlayBtnUI(); }
      else if (e.data === YT.PlayerState.PAUSED) { isPlaying = false; updatePlayBtnUI(); }
    }
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
