<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suniiyo Music - Live YouTube Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 120px; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Layout Setup */
    .app-layout { display: flex; flex: 1; min-height: calc(100vh - 120px); }

    /* Sidebar Navigation */
    sidebar {
      width: 240px;
      background-color: #000000;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #282828;
    }
    
    .logo-container { margin-bottom: 20px; text-align: center; }
    .logo-container h1 { color: #1db954; font-size: 24px; }
    .logo-container p { color: #b3b3b3; font-size: 11px; }

    .nav-btn {
      background: #181818;
      color: #b3b3b3;
      border: 1px solid #282828;
      padding: 12px 15px;
      border-radius: 8px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { background: #1db954; color: #000; }
    .nav-btn.back-btn { background: #333333; color: #ffffff; border-color: #444; margin-bottom: 10px; }
    .nav-btn.back-btn:hover { background: #444444; }

    .nav-divider { height: 1px; background: #282828; margin: 10px 0; }

    /* Main Area */
    .main-content { flex: 1; padding: 20px; background: #121212; overflow-y: auto; }

    .search-container { display: flex; gap: 10px; max-width: 600px; margin-bottom: 25px; }
    .search-box {
      flex: 1;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #1db954;
      background: #181818;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-btn {
      background: #1db954;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title { font-size: 22px; margin-bottom: 20px; color: #1db954; border-left: 4px solid #1db954; padding-left: 10px; }
    
    /* Grid Layouts */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }

    .card { background: #181818; padding: 12px; border-radius: 10px; border: 1px solid #282828; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .card:hover { background: #282828; transform: translateY(-3px); }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .card h3 { font-size: 14px; margin-bottom: 5px; height: 36px; overflow: hidden; line-height: 1.2; }
    .card p { color: #b3b3b3; font-size: 12px; margin-bottom: 10px; }
    .play-btn { background-color: #1db954; color: #000; border: none; padding: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }

    /* Singer Circle Card */
    .singer-card { background: #181818; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #282828; }
    .singer-card:hover { background: #282828; border-color: #1db954; }
    .singer-card img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; border: 2px solid #1db954; }
    .singer-card h3 { font-size: 15px; color: #fff; }

    /* Bottom Player Bar */
    .player-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: #181818; 
      border-top: 2px solid #1db954; 
      padding: 10px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 1000; 
      gap: 15px;
      height: 90px;
    }

    .mini-info { display: flex; align-items: center; gap: 12px; min-width: 200px; }
    .mini-thumb { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; }
    .song-info h4 { color: #1db954; font-size: 14px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-info p { color: #aaaaaa; font-size: 12px; }

    .player-middle { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1; max-width: 500px; }
    .player-controls { display: flex; align-items: center; gap: 10px; }
    .control-btn { background: #282828; color: #fff; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .control-btn.play-toggle { background: #1db954; color: #000; font-size: 16px; padding: 6px 18px; }

    .seek-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: #aaa; }
    .seek-bar { flex-grow: 1; accent-color: #1db954; cursor: pointer; }

    .player-screen { width: 1px; height: 1px; opacity: 0.01; position: absolute; pointer-events: none; }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
      .logo-container { display: none; }
      .nav-btn { white-space: nowrap; font-size: 12px; padding: 8px 12px; }
      .nav-divider { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <sidebar>
      <div class="logo-container">
        <h1>Suniiyo Music</h1>
        <p>Live YouTube Player Engine</p>
      </div>

      <button class="nav-btn back-btn" onclick="goBack()">⬅ Back</button>
      <button class="nav-btn active" id="btn-home" onclick="loadTab('home')">🏠 Home</button>
      <button class="nav-btn" id="btn-trending" onclick="loadTab('trending')">🔥 Trending Songs</button>
      <button class="nav-btn" id="btn-singers" onclick="loadTab('singers')">🌟 Popular Singers</button>

      <div class="nav-divider"></div>

      <button class="nav-btn" id="btn-haryanvi" onclick="loadTab('haryanvi')">🎧 Haryanvi Songs</button>
      <button class="nav-btn" id="btn-punjabi" onclick="loadTab('punjabi')">🔥 Punjabi Songs</button>
      <button class="nav-btn" id="btn-hindi" onclick="loadTab('hindi')">🎵 Hindi Songs</button>
      <button class="nav-btn" id="btn-rajasthani" onclick="loadTab('rajasthani')">🪕 Rajasthani Songs</button>
    </sidebar>

    <div class="main-content">
      <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 Search any song, album or singer..." onkeydown="if(event.key==='Enter') searchYouTube()">
        <button class="search-btn" onclick="searchYouTube()">Search</button>
      </div>

      <div class="section-title" id="results-title">🔥 Trending Hits</div>
      <div class="grid" id="songs-grid"></div>
    </div>
  </div>

  <div class="player-bar">
    <div class="mini-info">
      <img id="mini-img" class="mini-thumb" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100" alt="Cover">
      <div class="song-info">
        <h4 id="song-title">Select a Song</h4>
        <p id="artist-name">Suniiyo Player</p>
      </div>
    </div>

    <div class="player-middle">
      <div class="player-controls">
        <button class="control-btn" onclick="skipTime(-10)">⏪ 10s</button>
        <button class="control-btn play-toggle" id="main-play-btn" onclick="togglePlayPause()">▶</button>
        <button class="control-btn" onclick="skipTime(10)">10s ⏩</button>
      </div>

      <div class="seek-container">
        <span id="curr-time">0:00</span>
        <input type="range" id="seek-bar" class="seek-bar" value="0" max="100" onchange="seekToTime(this.value)">
        <span id="dur-time">0:00</span>
      </div>
    </div>

    <div class="player-screen">
      <div id="player"></div>
    </div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyCefppJohInl4qBNknhjztiAKQZnmaYRyQ';
    let currentPlaylist = [];
    let ytPlayer;
    let isPlaying = false;
    let ytReady = false;
    let historyStack = [];

    const popularSingers = [
      { name: "Sidhu Moosewala", query: "Sidhu Moose Wala All Songs", img: "https://i.ytimg.com/vi/hT_nvWreIhg/hqdefault.jpg" },
      { name: "Diler Kharkiya", query: "Diler Kharkiya Songs", img: "https://i.ytimg.com/vi/W1sX3xJ0eN4/hqdefault.jpg" },
      { name: "Gulzaar Chhaniwala", query: "Gulzaar Chhaniwala Songs", img: "https://i.ytimg.com/vi/Z10hX7Wn7x8/hqdefault.jpg" },
      { name: "Khesari Lal Yadav", query: "Khesari Lal Songs", img: "https://i.ytimg.com/vi/d_e2L2K_yD8/hqdefault.jpg" },
      { name: "Badshah", query: "Badshah All Hit Songs", img: "https://i.ytimg.com/vi/NbyHNASFi6U/hqdefault.jpg" },
      { name: "Arijit Singh", query: "Arijit Singh Best Songs", img: "https://i.ytimg.com/vi/vS84E0Kz8l0/hqdefault.jpg" },
      { name: "Karan Aujla", query: "Karan Aujla New Songs", img: "https://i.ytimg.com/vi/3B_4M1K4LzA/hqdefault.jpg" }
    ];

    window.onload = function() {
      loadTab('home');
    };

    function setActiveBtn(tabId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function loadTab(tab, addToHistory = true) {
      if (addToHistory && (historyStack.length === 0 || historyStack[historyStack.length - 1].tab !== tab)) {
        historyStack.push({ type: 'tab', tab: tab });
      }

      setActiveBtn(tab);

      if (tab === 'home') fetchSongs('Trending Hit Songs 2026', '🔥 Home - Trending Hits');
      else if (tab === 'trending') fetchSongs('Top Trending Songs India', '🔥 Trending Songs');
      else if (tab === 'haryanvi') fetchSongs('Latest Haryanvi Songs 2026', '🎧 Haryanvi Hits');
      else if (tab === 'punjabi') fetchSongs('Top Punjabi Songs 2026', '🔥 Punjabi Hits');
      else if (tab === 'hindi') fetchSongs('Latest Bollywood Hindi Songs', '🎵 Hindi Hits');
      else if (tab === 'rajasthani') fetchSongs('Latest Rajasthani Marwadi Songs', '🪕 Rajasthani Hits');
      else if (tab === 'singers') renderSingersView();
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop(); // Remove current view
        const prev = historyStack[historyStack.length - 1];
        if (prev.type === 'tab') loadTab(prev.tab, false);
        else if (prev.type === 'query') fetchSongs(prev.query, prev.title, false);
      } else {
        loadTab('home', false);
      }
    }

    async function fetchSongs(query, title, addToHistory = true) {
      document.getElementById('results-title').innerText = title || `Results for: "${query}"`;
      
      if (addToHistory && historyStack.length > 0 && historyStack[historyStack.length - 1].query !== query) {
        historyStack.push({ type: 'query', query: query, title: title });
      }

      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=24&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.items && data.items.length > 0) {
          currentPlaylist = data.items
            .filter(item => item.id && item.id.videoId)
            .map(item => ({
              id: item.id.videoId,
              title: item.snippet.title,
              artist: item.snippet.channelTitle,
              img: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
            }));
          renderSongs(currentPlaylist);
        } else {
          document.getElementById('songs-grid').innerHTML = '<p style="grid-column:1/-1; text-align:center;">No songs found.</p>';
        }
      } catch (err) {
        console.error("YouTube API Error:", err);
      }
    }

    function renderSingersView() {
      document.getElementById('results-title').innerText = '🌟 Popular Singers';
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';
      
      popularSingers.forEach(singer => {
        const card = document.createElement('div');
        card.className = 'singer-card';
        card.onclick = () => fetchSongs(singer.query, `🌟 ${singer.name} Top Hits`);
        card.innerHTML = `
          <img src="${singer.img}" alt="${singer.name}">
          <h3>${singer.name}</h3>
        `;
        grid.appendChild(card);
      });
    }

    function searchYouTube() {
      const q = document.getElementById('search-input').value;
      if (q.trim() !== '') {
        fetchSongs(q, `🔍 Search: "${q}"`);
      }
    }

    function renderSongs(songs) {
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';
      songs.forEach((song) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${song.img}" alt="Thumb">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
          <button class="play-btn" onclick="playSong('${song.id}')">▶ Play Song</button>
        `;
        grid.appendChild(card);
      });
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 0, 'playsinline': 1 },
        events: {
          'onReady': () => { ytReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function playSong(videoId) {
      const song = currentPlaylist.find(s => s.id === videoId);
      if (!song) return;

      document.getElementById('song-title').innerText = song.title;
      document.getElementById('artist-name').innerText = song.artist;
      document.getElementById('mini-img').src = song.img;

      if (ytPlayer && ytReady) {
        ytPlayer.loadVideoById(videoId);
        isPlaying = true;
        updatePlayBtnUI();
      } else {
        setTimeout(() => playSong(videoId), 500);
      }
    }

    function togglePlayPause() {
      if (!ytPlayer || !ytReady) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        isPlaying = false;
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
      }
      updatePlayBtnUI();
    }

    function updatePlayBtnUI() {
      document.getElementById('main-play-btn').innerText = isPlaying ? "⏸" : "▶";
    }

    function skipTime(sec) {
      if (ytPlayer && ytReady && ytPlayer.getCurrentTime) {
        ytPlayer.seekTo(ytPlayer.getCurrentTime() + sec, true);
      }
    }

    function seekToTime(percent) {
      if (ytPlayer && ytReady && ytPlayer.getDuration) {
        ytPlayer.seekTo((percent / 100) * ytPlayer.getDuration(), true);
      }
    }

    setInterval(() => {
      if (ytPlayer && ytReady && isPlaying && ytPlayer.getCurrentTime) {
        const curr = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          document.getElementById('seek-bar').value = (curr / dur) * 100;
          document.getElementById('curr-time').innerText = formatTime(curr);
          document.getElementById('dur-time').innerText = formatTime(dur);
        }
      }
    }, 1000);

    function formatTime(t) {
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) { isPlaying = true; updatePlayBtnUI(); }
      else if (e.data === YT.PlayerState.PAUSED) { isPlaying = false; updatePlayBtnUI(); }
    }
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
