<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suniiyo Music - Native Audio Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 110px; display: flex; flex-direction: column; min-height: 100vh; }
    
    .app-layout { display: flex; flex: 1; min-height: calc(100vh - 110px); }

    sidebar {
      width: 240px;
      background-color: #000000;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #282828;
    }
    
    .logo-container { margin-bottom: 20px; text-align: center; }
    .logo-container h1 { color: #1db954; font-size: 24px; }
    .logo-container p { color: #b3b3b3; font-size: 11px; }

    .nav-btn {
      background: #181818;
      color: #b3b3b3;
      border: 1px solid #282828;
      padding: 12px 15px;
      border-radius: 8px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { background: #1db954; color: #000; }
    .nav-btn.back-btn { background: #333333; color: #ffffff; border-color: #444; margin-bottom: 10px; }
    .nav-btn.back-btn:hover { background: #444444; }

    .nav-divider { height: 1px; background: #282828; margin: 10px 0; }

    .main-content { flex: 1; padding: 20px; background: #121212; overflow-y: auto; }

    .search-container { display: flex; gap: 10px; max-width: 600px; margin-bottom: 25px; }
    .search-box {
      flex: 1;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #1db954;
      background: #181818;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .section-title { font-size: 22px; margin-bottom: 20px; color: #1db954; border-left: 4px solid #1db954; padding-left: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }

    .card { background: #181818; padding: 12px; border-radius: 10px; border: 1px solid #282828; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .card:hover { background: #282828; transform: translateY(-3px); }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .card h3 { font-size: 14px; margin-bottom: 5px; height: 36px; overflow: hidden; line-height: 1.2; }
    .card p { color: #b3b3b3; font-size: 12px; margin-bottom: 10px; }
    .play-btn { background-color: #1db954; color: #000; border: none; padding: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }

    .singer-card { background: #181818; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #282828; }
    .singer-card:hover { background: #282828; border-color: #1db954; }
    .singer-card img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; border: 2px solid #1db954; }
    .singer-card h3 { font-size: 15px; color: #fff; }

    .player-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: #181818; 
      border-top: 2px solid #1db954; 
      padding: 10px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 1000; 
      gap: 15px;
      height: 90px;
    }

    .mini-info { display: flex; align-items: center; gap: 12px; min-width: 200px; }
    .mini-thumb { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; }
    .song-info h4 { color: #1db954; font-size: 14px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-info p { color: #aaaaaa; font-size: 12px; }

    .player-middle { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1; max-width: 500px; }
    .player-controls { display: flex; align-items: center; gap: 10px; }
    .control-btn { background: #282828; color: #fff; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .control-btn.play-toggle { background: #1db954; color: #000; font-size: 16px; padding: 6px 18px; }

    .seek-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: #aaa; }
    .seek-bar { flex-grow: 1; accent-color: #1db954; cursor: pointer; }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
      .logo-container { display: none; }
      .nav-btn { white-space: nowrap; font-size: 12px; padding: 8px 12px; }
      .nav-divider { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <sidebar>
      <div class="logo-container">
        <h1>Suniiyo Music</h1>
        <p>Pure Music Engine</p>
      </div>

      <button class="nav-btn back-btn" onclick="goBack()">⬅ Back</button>
      <button class="nav-btn active" id="btn-home" onclick="loadTab('home')">🏠 Home</button>
      <button class="nav-btn" id="btn-trending" onclick="loadTab('trending')">🔥 Trending Songs</button>
      <button class="nav-btn" id="btn-singers" onclick="loadTab('singers')">🌟 Popular Singers</button>

      <div class="nav-divider"></div>

      <button class="nav-btn" id="btn-haryanvi" onclick="loadTab('haryanvi')">🎧 Haryanvi Songs</button>
      <button class="nav-btn" id="btn-punjabi" onclick="loadTab('punjabi')">🔥 Punjabi Songs</button>
      <button class="nav-btn" id="btn-hindi" onclick="loadTab('hindi')">🎵 Hindi Songs</button>
      <button class="nav-btn" id="btn-rajasthani" onclick="loadTab('rajasthani')">🪕 Rajasthani Songs</button>
    </sidebar>

    <div class="main-content">
      <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 Search songs or singers..." onkeyup="filterSongs()">
      </div>

      <div class="section-title" id="results-title">🔥 Trending Hits</div>
      <div class="grid" id="songs-grid"></div>
    </div>
  </div>

  <div class="player-bar">
    <div class="mini-info">
      <img id="mini-img" class="mini-thumb" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100" alt="Cover">
      <div class="song-info">
        <h4 id="song-title">Select a Song</h4>
        <p id="artist-name">Suniiyo Player</p>
      </div>
    </div>

    <div class="player-middle">
      <div class="player-controls">
        <button class="control-btn" onclick="skipTime(-10)">⏪ 10s</button>
        <button class="control-btn play-toggle" id="main-play-btn" onclick="togglePlayPause()">▶</button>
        <button class="control-btn" onclick="skipTime(10)">10s ⏩</button>
      </div>

      <div class="seek-container">
        <span id="curr-time">0:00</span>
        <input type="range" id="seek-bar" class="seek-bar" value="0" max="100" onchange="seekToTime(this.value)">
        <span id="dur-time">0:00</span>
      </div>
    </div>

    <!-- Hidden Native Audio Player -->
    <audio id="audio-engine" ontimeupdate="updateProgress()" onended="playNext()"></audio>
  </div>

  <script>
    // Stable Audio Streams Array
    const masterSongs = [
      // 🔥 Haryanvi
      { id: 'h1', title: 'Gypsy', artist: 'GD Kaur / Pranjal Dahiya', genre: 'haryanvi', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
      { id: 'h2', title: '52 Gaj Ka Daman', artist: 'Renuka Panwar', genre: 'haryanvi', img: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
      { id: 'h3', title: 'Moto', artist: 'Diler Kharkiya', genre: 'haryanvi', img: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
      { id: 'h4', title: 'Circle', artist: 'Dhandha Nyoliwala', genre: 'haryanvi', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
      { id: 'h5', title: 'Maruti', artist: 'Dhandha Nyoliwala', genre: 'haryanvi', img: 'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },

      // ⚡ Punjabi
      { id: 'p1', title: 'Softly', artist: 'Karan Aujla', genre: 'punjabi', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' },
      { id: 'p2', title: 'Elevated', artist: 'Shubh', genre: 'punjabi', img: 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3' },
      { id: 'p3', title: 'Lover', artist: 'Diljit Dosanjh', genre: 'punjabi', img: 'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3' },
      { id: 'p4', title: '295', artist: 'Sidhu Moosewala', genre: 'punjabi', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3' },

      // ❤️ Hindi / Bollywood
      { id: 'b1', title: 'Kesariya', artist: 'Arijit Singh', genre: 'hindi', img: 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3' },
      { id: 'b2', title: 'Tum Hi Ho', artist: 'Arijit Singh', genre: 'hindi', img: 'https://images.unsplash.com/photo-1445985543470-41fba5c3144a?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3' },

      // 🪕 Rajasthani
      { id: 'r1', title: 'Choudhary', artist: 'Mame Khan', genre: 'rajasthani', img: 'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=300', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3' }
    ];

    const popularSingers = [
      { name: "Sidhu Moosewala", genre: "punjabi", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" },
      { name: "Diler Kharkiya", genre: "haryanvi", img: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300" },
      { name: "Dhandha Nyoliwala", genre: "haryanvi", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" },
      { name: "Arijit Singh", genre: "hindi", img: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300" },
      { name: "Karan Aujla", genre: "punjabi", img: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300" }
    ];

    let currentSongs = [];
    let currentSongIndex = -1;
    const audio = document.getElementById('audio-engine');
    let historyStack = [];

    window.onload = function() {
      loadTab('home');
    };

    function setActiveBtn(tabId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function loadTab(tab, addToHistory = true) {
      if (addToHistory && (historyStack.length === 0 || historyStack[historyStack.length - 1] !== tab)) {
        historyStack.push(tab);
      }

      setActiveBtn(tab);
      document.getElementById('search-input').value = '';

      if (tab === 'home') {
        renderSongsList(masterSongs, '🏠 Home - Trending Tracks');
      } else if (tab === 'trending') {
        renderSongsList(masterSongs.slice().reverse(), '🔥 Trending Hits');
      } else if (tab === 'singers') {
        renderSingersView();
      } else {
        const filtered = masterSongs.filter(s => s.genre === tab);
        renderSongsList(filtered, `🎵 ${tab.toUpperCase()} Songs`);
      }
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prevTab = historyStack[historyStack.length - 1];
        loadTab(prevTab, false);
      } else {
        loadTab('home', false);
      }
    }

    function renderSongsList(songs, title) {
      currentSongs = songs;
      document.getElementById('results-title').innerText = title;
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';

      if (songs.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">No songs found.</p>';
        return;
      }

      songs.forEach((song, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${song.img}" alt="Thumb">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
          <button class="play-btn" onclick="playSelectedSong(${idx})">▶ Play Song</button>
        `;
        grid.appendChild(card);
      });
    }

    function renderSingersView() {
      document.getElementById('results-title').innerText = '🌟 Popular Singers';
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';
      
      popularSingers.forEach(singer => {
        const card = document.createElement('div');
        card.className = 'singer-card';
        card.onclick = () => {
          const singerSongs = masterSongs.filter(s => s.artist.toLowerCase().includes(singer.name.toLowerCase()));
          renderSongsList(singerSongs.length > 0 ? singerSongs : masterSongs.filter(s => s.genre === singer.genre), `🌟 ${singer.name} Songs`);
        };
        card.innerHTML = `
          <img src="${singer.img}" alt="${singer.name}">
          <h3>${singer.name}</h3>
        `;
        grid.appendChild(card);
      });
    }

    function filterSongs() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = masterSongs.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
      renderSongsList(filtered, `🔍 Search: "${q}"`);
    }

    function playSelectedSong(index) {
      currentSongIndex = index;
      const song = currentSongs[index];

      document.getElementById('song-title').innerText = song.title;
      document.getElementById('artist-name').innerText = song.artist;
      document.getElementById('mini-img').src = song.img;

      audio.src = song.src;
      audio.play();
      document.getElementById('main-play-btn').innerText = "⏸";
    }

    function togglePlayPause() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        document.getElementById('main-play-btn').innerText = "⏸";
      } else {
        audio.pause();
        document.getElementById('main-play-btn').innerText = "▶";
      }
    }

    function skipTime(sec) {
      if (audio.duration) {
        audio.currentTime += sec;
      }
    }

    function updateProgress() {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('seek-bar').value = pct;
        document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
        document.getElementById('dur-time').innerText = formatTime(audio.duration);
      }
    }

    function seekToTime(pct) {
      if (audio.duration) {
        audio.currentTime = (pct / 100) * audio.duration;
      }
    }

    function playNext() {
      if (currentSongs.length > 0) {
        currentSongIndex = (currentSongIndex + 1) % currentSongs.length;
        playSelectedSong(currentSongIndex);
      }
    }

    function formatTime(t) {
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }
  </script>
</body>
</html>
