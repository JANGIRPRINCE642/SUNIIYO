<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suniiyo Music - Option 2 Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 20px; display: flex; flex-direction: column; min-height: 100vh; }
    
    .app-layout { display: flex; flex: 1; min-height: 100vh; }

    /* Sidebar Navigation */
    sidebar {
      width: 240px;
      background-color: #000000;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #282828;
    }
    
    .logo-container { margin-bottom: 20px; text-align: center; }
    .logo-container h1 { color: #1db954; font-size: 24px; }
    .logo-container p { color: #b3b3b3; font-size: 11px; }

    .nav-btn {
      background: #181818;
      color: #b3b3b3;
      border: 1px solid #282828;
      padding: 12px 15px;
      border-radius: 8px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { background: #1db954; color: #000; }
    .nav-btn.back-btn { background: #333333; color: #ffffff; border-color: #444; margin-bottom: 10px; }
    .nav-btn.back-btn:hover { background: #444444; }

    .nav-divider { height: 1px; background: #282828; margin: 10px 0; }

    /* Main Area */
    .main-content { flex: 1; padding: 20px; background: #121212; overflow-y: auto; }

    .search-container { display: flex; gap: 10px; max-width: 600px; margin-bottom: 25px; }
    .search-box {
      flex: 1;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #1db954;
      background: #181818;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .section-title { font-size: 22px; margin-bottom: 20px; color: #1db954; border-left: 4px solid #1db954; padding-left: 10px; }
    
    /* Grid Layouts */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }

    .card { background: #181818; padding: 12px; border-radius: 10px; border: 1px solid #282828; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .card:hover { background: #282828; transform: translateY(-3px); }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .card h3 { font-size: 14px; margin-bottom: 5px; height: 36px; overflow: hidden; line-height: 1.2; }
    .card p { color: #b3b3b3; font-size: 12px; margin-bottom: 10px; }
    .play-btn { background-color: #1db954; color: #000; border: none; padding: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }

    .singer-card { background: #181818; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #282828; }
    .singer-card:hover { background: #282828; border-color: #1db954; }
    .singer-card img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; border: 2px solid #1db954; }
    .singer-card h3 { font-size: 15px; color: #fff; }

    /* Active Player Screen Overlay */
    .player-view {
      display: none;
      background: #181818;
      border: 1px solid #282828;
      border-radius: 12px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .player-header h3 { color: #1db954; }
    .close-player-btn { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .close-player-btn:hover { background: #1db954; color: #000; }

    .iframe-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      border-radius: 10px;
      overflow: hidden;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
      .logo-container { display: none; }
      .nav-btn { white-space: nowrap; font-size: 12px; padding: 8px 12px; }
      .nav-divider { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <sidebar>
      <div class="logo-container">
        <h1>Suniiyo Music</h1>
        <p>Direct Player Engine</p>
      </div>

      <button class="nav-btn back-btn" onclick="goBack()">⬅ Back</button>
      <button class="nav-btn active" id="btn-home" onclick="loadTab('home')">🏠 Home</button>
      <button class="nav-btn" id="btn-trending" onclick="loadTab('trending')">🔥 Trending Songs</button>
      <button class="nav-btn" id="btn-singers" onclick="loadTab('singers')">🌟 Popular Singers</button>

      <div class="nav-divider"></div>

      <button class="nav-btn" id="btn-haryanvi" onclick="loadTab('haryanvi')">🎧 Haryanvi Songs</button>
      <button class="nav-btn" id="btn-punjabi" onclick="loadTab('punjabi')">🔥 Punjabi Songs</button>
      <button class="nav-btn" id="btn-hindi" onclick="loadTab('hindi')">🎵 Hindi Songs</button>
      <button class="nav-btn" id="btn-rajasthani" onclick="loadTab('rajasthani')">🪕 Rajasthani Songs</button>
    </sidebar>

    <div class="main-content">
      <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 Search songs or singers..." onkeyup="filterSongs()">
      </div>

      <!-- Player View Section -->
      <div class="player-view" id="player-screen">
        <div class="player-header">
          <h3 id="current-playing-title">Playing Song</h3>
          <button class="close-player-btn" onclick="closePlayer()">❌ Close Player</button>
        </div>
        <div class="iframe-container" id="iframe-box"></div>
      </div>

      <!-- Grid Content -->
      <div id="content-area">
        <div class="section-title" id="results-title">🏠 Home - Recommended Songs</div>
        <div class="grid" id="songs-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // Strict Verified YouTube IDs (Exact Song Mapping)
    const masterSongs = [
      // 🔥 Haryanvi
      { id: 'h1', title: 'Circle', artist: 'Dhandha Nyoliwala', genre: 'haryanvi', ytId: 'P13L1y74Nno', img: 'https://img.youtube.com/vi/P13L1y74Nno/hqdefault.jpg' },
      { id: 'h2', title: 'Maruti', artist: 'Dhandha Nyoliwala', genre: 'haryanvi', ytId: '_ijaEtNzZgw', img: 'https://img.youtube.com/vi/_ijaEtNzZgw/hqdefault.jpg' },
      { id: 'h3', title: 'Gypsy', artist: 'GD Kaur / Pranjal Dahiya', genre: 'haryanvi', ytId: 'FINaXgBgf8s', img: 'https://img.youtube.com/vi/FINaXgBgf8s/hqdefault.jpg' },
      { id: 'h4', title: '52 Gaj Ka Daman', artist: 'Renuka Panwar', genre: 'haryanvi', ytId: 'CZ1C3fInxio', img: 'https://img.youtube.com/vi/CZ1C3fInxio/hqdefault.jpg' },
      { id: 'h5', title: 'Moto', artist: 'Diler Kharkiya', genre: 'haryanvi', ytId: 'WffX-44kOz0', img: 'https://img.youtube.com/vi/WffX-44kOz0/hqdefault.jpg' },

      // ⚡ Punjabi
      { id: 'p1', title: 'Softly', artist: 'Karan Aujla', genre: 'punjabi', ytId: 'cER93M4_kK0', img: 'https://img.youtube.com/vi/cER93M4_kK0/hqdefault.jpg' },
      { id: 'p2', title: 'Elevated', artist: 'Shubh', genre: 'punjabi', ytId: 'vX2cTIn053s', img: 'https://img.youtube.com/vi/vX2cTIn053s/hqdefault.jpg' },
      { id: 'p3', title: 'Lover', artist: 'Diljit Dosanjh', genre: 'punjabi', ytId: 'm4i7x6lGj4g', img: 'https://img.youtube.com/vi/m4i7x6lGj4g/hqdefault.jpg' },
      { id: 'p4', title: '295', artist: 'Sidhu Moosewala', genre: 'punjabi', ytId: 'n_FCrCQ6-bA', img: 'https://img.youtube.com/vi/n_FCrCQ6-bA/hqdefault.jpg' },

      // ❤️ Hindi
      { id: 'b1', title: 'Kesariya', artist: 'Arijit Singh', genre: 'hindi', ytId: 'BddP6PYo2gs', img: 'https://img.youtube.com/vi/BddP6PYo2gs/hqdefault.jpg' },
      { id: 'b2', title: 'Tum Hi Ho', artist: 'Arijit Singh', genre: 'hindi', ytId: 'Umqb9KENgmk', img: 'https://img.youtube.com/vi/Umqb9KENgmk/hqdefault.jpg' },

      // 🪕 Rajasthani
      { id: 'r1', title: 'Choudhary', artist: 'Mame Khan', genre: 'rajasthani', ytId: 'm2g0y76JpGk', img: 'https://img.youtube.com/vi/m2g0y76JpGk/hqdefault.jpg' }
    ];

    const popularSingers = [
      { name: "Dhandha Nyoliwala", genre: "haryanvi", img: "https://img.youtube.com/vi/_ijaEtNzZgw/hqdefault.jpg" },
      { name: "Sidhu Moosewala", genre: "punjabi", img: "https://img.youtube.com/vi/n_FCrCQ6-bA/hqdefault.jpg" },
      { name: "Diler Kharkiya", genre: "haryanvi", img: "https://img.youtube.com/vi/WffX-44kOz0/hqdefault.jpg" },
      { name: "Arijit Singh", genre: "hindi", img: "https://img.youtube.com/vi/BddP6PYo2gs/hqdefault.jpg" },
      { name: "Karan Aujla", genre: "punjabi", img: "https://img.youtube.com/vi/cER93M4_kK0/hqdefault.jpg" }
    ];

    let historyStack = [];

    window.onload = function() {
      loadTab('home');
    };

    function setActiveBtn(tabId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function loadTab(tab, addToHistory = true) {
      if (addToHistory && (historyStack.length === 0 || historyStack[historyStack.length - 1] !== tab)) {
        historyStack.push(tab);
      }

      closePlayer();
      setActiveBtn(tab);
      document.getElementById('search-input').value = '';

      if (tab === 'home') {
        renderSongsList(masterSongs, '🏠 Home - Recommended Songs');
      } else if (tab === 'trending') {
        renderSongsList(masterSongs.slice().reverse(), '🔥 Trending Songs');
      } else if (tab === 'singers') {
        renderSingersView();
      } else {
        const filtered = masterSongs.filter(s => s.genre === tab);
        renderSongsList(filtered, `🎵 ${tab.toUpperCase()} Songs`);
      }
    }

    function goBack() {
      if (document.getElementById('player-screen').style.display === 'block') {
        closePlayer();
        return;
      }

      if (historyStack.length > 1) {
        historyStack.pop();
        const prevTab = historyStack[historyStack.length - 1];
        loadTab(prevTab, false);
      } else {
        loadTab('home', false);
      }
    }

    function renderSongsList(songs, title) {
      document.getElementById('results-title').innerText = title;
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';

      if (songs.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">No songs found.</p>';
        return;
      }

      songs.forEach((song) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${song.img}" alt="Thumb">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
          <button class="play-btn" onclick="playSongScreen('${song.ytId}', '${song.title} - ${song.artist}')">▶ Play Song</button>
        `;
        grid.appendChild(card);
      });
    }

    function renderSingersView() {
      document.getElementById('results-title').innerText = '🌟 Popular Singers';
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';
      
      popularSingers.forEach(singer => {
        const card = document.createElement('div');
        card.className = 'singer-card';
        card.onclick = () => {
          const singerSongs = masterSongs.filter(s => s.artist.toLowerCase().includes(singer.name.toLowerCase()));
          renderSongsList(singerSongs.length > 0 ? singerSongs : masterSongs.filter(s => s.genre === singer.genre), `🌟 ${singer.name} Songs`);
        };
        card.innerHTML = `
          <img src="${singer.img}" alt="${singer.name}">
          <h3>${singer.name}</h3>
        `;
        grid.appendChild(card);
      });
    }

    function filterSongs() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = masterSongs.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
      renderSongsList(filtered, `🔍 Search: "${q}"`);
    }

    function playSongScreen(ytId, displayTitle) {
      document.getElementById('current-playing-title').innerText = "▶ Now Playing: " + displayTitle;
      const iframeBox = document.getElementById('iframe-box');
      iframeBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      
      document.getElementById('player-screen').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('iframe-box').innerHTML = '';
    }
  </script>
</body>
</html>
